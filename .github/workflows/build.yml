name: Build Custom Image

on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  IMAGE_NAME: ${{ github.event.repository.name }}
  IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

jobs:
  build:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load environment variables
        run: |
          if [ -f image-template.env ]; then
            cat image-template.env >> $GITHUB_ENV
          fi

      - name: Lowercase Registry and Image Name
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Build image using Podman / Bootc
        uses: redhat-actions/buildah-build@v2
        id: build_image
        with:
          containerfiles: |
            ./Containerfile
          image: ${{ env.IMAGE_NAME }}
          tags: latest ${{ github.sha }}

      - name: Push To GHCR
        uses: redhat-actions/push-to-registry@v2
        id: push
        with:
          image: ${{ steps.build_image.outputs.image }}
          tags: ${{ steps.build_image.outputs.tags }}
          registry: ${{ env.IMAGE_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR for Cosign
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.5.0

      - name: Sign Image
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
        run: |
          echo "Signing image..."
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}

  generate-iso:
    name: Generate Bootable ISO
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase Registry and Image Name
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> $GITHUB_ENV
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> $GITHUB_ENV
        env:
          IMAGE_NAME: ${{ github.event.repository.name }}
          IMAGE_REGISTRY: ghcr.io/${{ github.repository_owner }}

      - name: Generate ISO
        uses: JasonN3/build-container-installer@v1.3.0
        id: isogenerator
        with:
          image_name: ${{ env.IMAGE_NAME }}
          image_repo: ${{ env.IMAGE_REGISTRY }}
          image_tag: latest
          variant: 'Silverblue'
          version: '40'
          image_signed: false
          iso_name: ${{ env.IMAGE_NAME }}-latest.iso

      - name: Generate SHA256 Checksum
        run: |
          sha256sum "${{ steps.isogenerator.outputs.iso_path }}/${{ steps.isogenerator.outputs.iso_name }}" > "${{ steps.isogenerator.outputs.iso_path }}/${{ steps.isogenerator.outputs.iso_name }}.sha256"

      - name: Upload ISO and Checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.IMAGE_NAME }}-iso
          path: |
            ${{ steps.isogenerator.outputs.iso_path }}/${{ steps.isogenerator.outputs.iso_name }}
            ${{ steps.isogenerator.outputs.iso_path }}/${{ steps.isogenerator.outputs.iso_name }}.sha256
          if-no-files-found: error
          retention-days: 14